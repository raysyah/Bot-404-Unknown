services:
  - type: web
    name: moon-light-store-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: GRAPH_API_VERSION
        value: v23.0
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: STORE_NAME
        value: Moon Light Store
      - key: ADMIN_CONTACT_TEXT
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
